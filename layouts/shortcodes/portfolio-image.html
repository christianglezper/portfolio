{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "Portfolio image" -}}
{{- $caption := .Get "caption" -}}
{{- $isRemote := or (hasPrefix $src "https://") (hasPrefix $src "http://") -}}
{{- $imageSrc := cond $isRemote $src ($src | relURL) -}}
<figure class="portfolio-image">
  <img src="{{ $imageSrc }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  {{- with $caption }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
