name: Deploy Hugo portfolio to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.26.0
      HUGO_VERSION: 0.157.0
      TZ: America/Puerto_Rico
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Hugo Extended
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Prepare portfolio image assets
        run: |
          set -euo pipefail
          mkdir -p static/images/projects
          tr -d '\r\n ' < static/images/projects/neuromarketing-metodologia.b64.txt | base64 --decode > static/images/projects/neuromarketing-metodologia.webp
          cat static/images/projects/neuromarketing-conclusiones.part1.b64.txt \
              static/images/projects/neuromarketing-conclusiones.part2.b64.txt \
              static/images/projects/neuromarketing-conclusiones.part3.b64.txt \
              static/images/projects/neuromarketing-conclusiones.part4.b64.txt \
            | tr -d '\r\n ' | base64 --decode > static/images/projects/neuromarketing-conclusiones.webp
          tr -d '\r\n ' < static/images/projects/neuromarketing-recomendaciones.b64.txt | base64 --decode > static/images/projects/neuromarketing-recomendaciones.webp
          test -s static/images/projects/neuromarketing-metodologia.webp
          test -s static/images/projects/neuromarketing-conclusiones.webp
          test -s static/images/projects/neuromarketing-recomendaciones.webp
          file static/images/projects/neuromarketing-*.webp

      - name: Build site
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "https://christianglezper.github.io/portfolio/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
